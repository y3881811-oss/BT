name: Build and Release Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 【核心】缓存签名文件。只要缓存命中，以后的每次编译都用这个不变的签名
      - name: Cache Android Debug Keystore
        uses: actions/cache@v3
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-android-debug-keystore-v1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle wrapper
            ./gradlew assembleDebug
          fi

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.date.outputs.date }}-${{ github.run_number }}
          name: Release v${{ steps.date.outputs.date }}-${{ github.run_number }}
          body: |
            自动构建的 Android TV 版本。
            构建时间：${{ steps.date.outputs.date }} (Run ${{ github.run_number }})
            支持架构：armeabi-v7a, arm64-v8a
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}