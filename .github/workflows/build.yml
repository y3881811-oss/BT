name: Build and Release Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  # 定时任务：UTC 18:00 (北京时间凌晨 2:00)
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. 尝试恢复缓存的签名文件
      - name: Cache Android Debug Keystore
        id: cache-keystore
        uses: actions/cache@v3
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-android-debug-keystore-v1

      # 2. 【核心修复】如果缓存没命中（找不到），就自动生成一个固定签名的文件
      - name: Generate Fixed Debug Keystore
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle wrapper
            ./gradlew assembleDebug
          fi

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.date.outputs.date }}-${{ github.run_number }}
          name: Release v${{ steps.date.outputs.date }}-${{ github.run_number }}
          body: |
            自动构建的 Android TV 版本。
            构建时间：${{ steps.date.outputs.date }} (Run ${{ github.run_number }})
            支持架构：armeabi-v7a, arm64-v8a
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}